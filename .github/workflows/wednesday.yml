name: Wednesday idiom challenge

on:
  schedule:
    - cron: "32 10 * * 3"  # Challenge, 10:32 UTC
    - cron: "47 12 * * 3"  # Challenge catch-up
    - cron: "47 14 * * 3"  # Challenge catch-up
    - cron: "32 18 * * 3"  # Reveal, 18:32 UTC
    - cron: "47 20 * * 3"  # Reveal catch-up
    - cron: "47 22 * * 3"  # Reveal catch-up
  workflow_dispatch:
    inputs:
      phase:
        description: "Which post to preview or send"
        type: choice
        options:
          - challenge
          - reveal
        default: challenge
      date:
        description: "Wednesday YYYY-MM-DD (blank = today in UTC)"
        type: string
        default: ""
      dry_run:
        description: "Preview only: send nothing and change no state"
        type: boolean
        default: true

# Shares topic_posts.csv with participation jobs. Both idiom phases also
# share idiom_sent_log.json, so only one state writer runs at a time.
concurrency:
  group: telegram-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      - name: Post or preview the idiom
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PHASE: ${{ inputs.phase }}
          TARGET_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE" in
              "32 10 * * 3"|"47 12 * * 3"|"47 14 * * 3") phase=challenge ;;
              "32 18 * * 3"|"47 20 * * 3"|"47 22 * * 3") phase=reveal ;;
              *) echo "Unknown schedule" >&2; exit 1 ;;
            esac
            args=(--phase "$phase" --scheduled)
          else
            args=(--phase "$MANUAL_PHASE")
            if [[ -n "$TARGET_DATE" ]]; then args+=(--date "$TARGET_DATE"); fi
          fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python send_wednesday_idiom.py "${args[@]}"

      # Preserve successful sends even if a subsequent operation fails.
      - name: Commit idiom state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add idiom_sent_log.json
          if [[ -f topic_posts.csv ]]; then git add topic_posts.csv; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Record Wednesday idiom post ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin main
            git push
          fi
