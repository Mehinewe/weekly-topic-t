name: Shadowing challenge

on:
  schedule:
    # All times GMT. Each phase has a primary slot plus two later catch-ups
    # (GitHub cron is best-effort); the script is idempotent, so only the first
    # run that lands does anything.
    - cron: "47 10 * * 1"  # Monday   - post the weekly shadowing video
    - cron: "47 12 * * 1"
    - cron: "47 14 * * 1"
    - cron: "47 15 * * 4"  # Thursday - showcase the entries + send ballots
    - cron: "47 17 * * 4"
    - cron: "47 19 * * 4"
    - cron: "47 15 * * 0"  # Sunday   - close voting, announce winner
    - cron: "47 17 * * 0"
    - cron: "47 19 * * 0"
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase to preview or send"
        type: choice
        options:
          - video
          - showcase
          - results
        default: video
      date:
        description: "Any date in the target week, YYYY-MM-DD (blank = today, GMT)"
        type: string
        default: ""
      dry_run:
        description: "Preview only: send nothing and change no state"
        type: boolean
        default: true

# Shares members.csv / activity_log.csv with the poller, so only one state
# writer runs at a time.
concurrency:
  group: telegram-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      - name: Run the shadowing phase
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AVATAR_FTP_HOST: ${{ secrets.AVATAR_FTP_HOST }}
          AVATAR_FTP_USER: ${{ secrets.AVATAR_FTP_USER }}
          AVATAR_FTP_PASSWORD: ${{ secrets.AVATAR_FTP_PASSWORD }}
          AVATAR_PUBLIC_BASE: ${{ vars.AVATAR_PUBLIC_BASE }}
          AVATAR_FTP_DIR: ${{ vars.AVATAR_FTP_DIR }}
          AVATAR_FTP_PORT: ${{ vars.AVATAR_FTP_PORT }}
          AVATAR_FTP_TLS: ${{ vars.AVATAR_FTP_TLS }}
          BADGE_APP_URL: ${{ vars.BADGE_APP_URL }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_PHASE: ${{ inputs.phase }}
          TARGET_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE" in
              *" * * 1") phase=video ;;
              *" * * 4") phase=showcase ;;
              *" * * 0") phase=results ;;
              *) echo "Unknown schedule" >&2; exit 1 ;;
            esac
            args=(--phase "$phase" --scheduled)
          else
            args=(--phase "$MANUAL_PHASE")
            if [[ -n "$TARGET_DATE" ]]; then args+=(--date "$TARGET_DATE"); fi
          fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python send_shadowing.py "${args[@]}"

      # Preserve successful sends even if a later step fails.
      - name: Commit shadowing state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shadowing_state.json topic_posts.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Record shadowing challenge post ($(date -u '+%Y-%m-%d %H:%M GMT'))"
            git pull --rebase --autostash origin main
            git push
          fi
