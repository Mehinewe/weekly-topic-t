name: Shadowing challenge

on:
  schedule:
    # GMT. Runs every day at these times; `send_shadowing.py --phase due` decides
    # what (if anything) is due today from schedule_shadowing.csv / shadowing_state.json
    # (video, Thursday-style showcase, results, join announcement). The later slots
    # are catch-ups for GitHub's best-effort cron; every phase is idempotent.
    - cron: "7 1 * * *"
    - cron: "7 3 * * *"
    - cron: "47 10 * * *"
    - cron: "47 12 * * *"
    - cron: "47 14 * * *"
    - cron: "47 15 * * *"
    - cron: "47 17 * * *"
    - cron: "47 19 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase to preview or send (due = whatever is due right now)"
        type: choice
        options:
          - due
          - announce
          - video
          - showcase
          - results
        default: due
      date:
        description: "Any date in the target week, YYYY-MM-DD (blank = today, GMT; not for 'due')"
        type: string
        default: ""
      dry_run:
        description: "Preview only: send nothing and change no state"
        type: boolean
        default: true

# Shares members.csv / activity_log.csv with the poller, so only one state
# writer runs at a time.
concurrency:
  group: telegram-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      - name: Run the shadowing phase
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AVATAR_FTP_HOST: ${{ secrets.AVATAR_FTP_HOST }}
          AVATAR_FTP_USER: ${{ secrets.AVATAR_FTP_USER }}
          AVATAR_FTP_PASSWORD: ${{ secrets.AVATAR_FTP_PASSWORD }}
          AVATAR_PUBLIC_BASE: ${{ vars.AVATAR_PUBLIC_BASE }}
          AVATAR_FTP_DIR: ${{ vars.AVATAR_FTP_DIR }}
          AVATAR_FTP_PORT: ${{ vars.AVATAR_FTP_PORT }}
          AVATAR_FTP_TLS: ${{ vars.AVATAR_FTP_TLS }}
          BADGE_APP_URL: ${{ vars.BADGE_APP_URL }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PHASE: ${{ inputs.phase }}
          TARGET_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            args=(--phase due)
          else
            args=(--phase "$MANUAL_PHASE")
            if [[ -n "$TARGET_DATE" && "$MANUAL_PHASE" != "due" ]]; then args+=(--date "$TARGET_DATE"); fi
          fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python send_shadowing.py "${args[@]}"

      # Preserve successful sends even if a later step fails.
      - name: Commit shadowing state
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in shadowing_state.json topic_posts.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Record shadowing challenge post ($(date -u '+%Y-%m-%d %H:%M GMT'))"
            git pull --rebase --autostash origin main
            git push
          fi
