name: Participation reminder (Friday)

on:
  schedule:
    - cron: "0 16 * * 5"   # 16:00 UTC Friday
    - cron: "0 19 * * 5"   # 19:00 UTC catch-up

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (list who would be nudged, send nothing)"
        type: boolean
        default: true

concurrency:
  group: telegram-state
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Send Friday reminders
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_reminders.py --which fri ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit reminder log
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reminder_log.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Participation reminders — Fri ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin main && git push
          fi
